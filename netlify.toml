[build]
  command = "echo 'Static site'"
  publish = "."
  functions = "netlify/functions"

[dev]
  publish = "."
  command = "echo dev"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Cookbook maker bridge: Fern reads recipe pages and builds covers, which can take longer than the 10 s default.
[functions."cookbook"]
  timeout = 26
